services:
  qingji:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ${DATA_PATH:-./data}:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      PORT: "${PORT:-8080}"
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      # 图床（EasyImages2.0）
      IMAGE_HOST_URL: ${IMAGE_HOST_URL:-}
      IMAGE_HOST_TOKEN: ${IMAGE_HOST_TOKEN:-}
    restart: unless-stopped
