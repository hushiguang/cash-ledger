services:
  qingji:
    build: .
    # 用宿主机网络：图床 image.coooo.tech 只有 IPv6 地址，Docker bridge 网络连不上（ENETUNREACH），
    # 容器必须与 NAS 共用网络栈才能访问 IPv6。
    # 访问端口就是 PORT 本身（不做映射），例如 PORT=10091 → http://NAS的IP:10091
    # 想改回端口映射：NETWORK_MODE=bridge ./scripts/deploy.sh
    network_mode: host
    volumes:
      - ${DATA_PATH:-./data}:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # Docker 默认网络没有 IPv6，解析优先走 IPv4，避免图床请求 ENETUNREACH
      NODE_OPTIONS: ${NODE_OPTIONS:---dns-result-order=ipv4first}
      PORT: "${PORT:-8080}"
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      # 图床（EasyImages2.0）
      IMAGE_HOST_URL: ${IMAGE_HOST_URL:-}
      IMAGE_HOST_TOKEN: ${IMAGE_HOST_TOKEN:-}
    restart: unless-stopped
