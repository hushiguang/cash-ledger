<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：配合 env(safe-area-inset-*)，刘海和底部小黑条才不会压住内容 -->
    <!-- interactive-widget：键盘弹起时收缩布局，而不是把底栏顶上来盖住输入框 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="format-detection" content="telephone=no, email=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="轻账单" />
    <meta name="theme-color" content="#f7f4fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <title>轻账单</title>
    <script>
      (function () {
        var theme = localStorage.getItem('qingji.theme');
        if (theme !== 'light' && theme !== 'dark') theme = 'system';
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.resolved = theme === 'dark' || (theme === 'system' && dark) ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,560;8..60,680&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
